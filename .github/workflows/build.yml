name: Release

on:
  push:
    tags: ['v*']

# A re-pushed tag makes the previous run on it obsolete.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Disk images and signing need macOS. libghostty-vt is prebuilt and
    # committed under resources/<os>-<arch>/, so no Zig or Ghostty source is
    # needed here.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # The release packages the prebuilt library for each target; fail before
      # the build if one is missing, rather than fall back to building it.
      - name: Verify the prebuilt libghostty-vt
        run: |
          missing=0
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            if ! ls resources/"$target"/libghostty-vt-local-* >/dev/null 2>&1; then
              echo "missing resources/$target/libghostty-vt-local-*" >&2
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "run ./scripts/build-libghostty.sh $(cat ghostty.version) all locally and commit resources/" >&2
            exit 1
          fi

      # One app per platform and architecture, each carrying only its own
      # libghostty-vt: darwin arm64 and amd64 (signed, with a disk image) and
      # linux amd64 and arm64 (the executable with its packages).
      - name: Build the apps
        run: ./scripts/build-release.sh darwin/arm64 darwin/amd64 linux/amd64 linux/arm64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=""
          case "$tag" in
            *-rc.*) prerelease=--prerelease ;;
          esac
          # The disk images and the Linux packages, without the bare executables.
          files=$(find build -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \))
          gh release create "$tag" $files \
            --repo "$GITHUB_REPOSITORY" \
            --title "Code ${version}" \
            --generate-notes \
            ${prerelease:+"$prerelease"}
