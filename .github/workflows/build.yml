name: Release

on:
  push:
    tags: ['v*']

# A re-pushed tag makes the previous run on it obsolete.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Disk images and signing need macOS, and Zig cross-compiles libghostty-vt
    # for Linux from here too.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          # Must match Ghostty's minimum_zig_version for the pinned release.
          version: 0.17.0

      - name: Test
        run: go test ./...

      - name: Build libghostty-vt
        run: ./scripts/build-libghostty.sh "$(cat ghostty.version)" all

      # One app per platform and architecture, each carrying only its own
      # libghostty-vt: darwin arm64 and amd64 (signed, with a disk image) and
      # linux amd64 and arm64 (the executable with its packages).
      - name: Build the apps
        run: ./scripts/build-release.sh darwin/arm64 darwin/amd64 linux/amd64 linux/arm64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=""
          case "$tag" in
            *-rc.*) prerelease=--prerelease ;;
          esac
          # The disk images and the Linux packages, without the bare executables.
          files=$(find build -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \))
          gh release create "$tag" $files \
            --repo "$GITHUB_REPOSITORY" \
            --title "Code ${version}" \
            --generate-notes \
            ${prerelease:+"$prerelease"}
