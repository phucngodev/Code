name: code
options:
  bundleIdPrefix: dev.phucngo
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: Y2X9JDX474
    OTHER_LDFLAGS: -lstdc++
    DEAD_CODE_STRIPPING: YES
targets:
  code:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Vendor/GhosttyResources/terminfo
        type: folder
      - path: Vendor/GhosttyResources/ghostty
        type: folder
      - path: Resources/shell-integration
        type: folder
      - path: Resources/agents
        type: folder
    dependencies:
      - target: cde
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: $(CODE_DISPLAY_NAME)
        CFBundleDisplayName: $(CODE_DISPLAY_NAME)
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        # Programs run inside Code are attributed to Code by macOS, so their
        # permission prompts show these.
        NSAppleEventsUsageDescription: A program running in Code would like to use AppleScript.
        NSBluetoothAlwaysUsageDescription: A program running in Code would like to use Bluetooth.
        NSCalendarsUsageDescription: A program running in Code would like to access your calendars.
        NSCameraUsageDescription: A program running in Code would like to use the camera.
        NSContactsUsageDescription: A program running in Code would like to access your contacts.
        NSLocalNetworkUsageDescription: A program running in Code would like to access the local network.
        NSLocationUsageDescription: A program running in Code would like to access your location.
        NSMicrophoneUsageDescription: A program running in Code would like to use the microphone.
        NSMotionUsageDescription: A program running in Code would like to access motion data.
        NSPhotoLibraryUsageDescription: A program running in Code would like to access your photos.
        NSRemindersUsageDescription: A program running in Code would like to access your reminders.
        NSSpeechRecognitionUsageDescription: A program running in Code would like to use speech recognition.
        NSSystemAdministrationUsageDescription: A program running in Code requires administrator privileges.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folders
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.directory]
        NSServices:
          - NSMenuItem:
              default: New Code Workspace Here
            NSMessage: openWorkspace
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
          - NSMenuItem:
              default: New Code Window Here
            NSMessage: openWindow
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
    settings:
      base:
        PRODUCT_NAME: Code
        # Placeholders; the stamp-version script writes the real values from git.
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: "0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.phucngo.code
        CODE_DISPLAY_NAME: Code
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Code.entitlements
      configs:
        # The hardened runtime only loads libraries signed by the app's own
        # team, so Debug is signed with the team too rather than ad-hoc.
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          # A debug build running beside the installed Code is a separate app to
          # macOS, so neither steals the other's activation or Dock entry.
          PRODUCT_BUNDLE_IDENTIFIER: dev.phucngo.code.debug
          CODE_DISPLAY_NAME: Code Debug
        Release:
          CODE_SIGN_IDENTITY: Apple Development
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Notarization rejects the debugging entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/scripts/stamp-version.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - codeTests
  cde:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tools/cde
      - path: Sources/Agent/Shared
    settings:
      base:
        PRODUCT_NAME: cde
        PRODUCT_BUNDLE_IDENTIFIER: dev.phucngo.code.cde
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Development
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  codeTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: cde
        embed: false
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    sources:
      - path: Tests
      - path: Sources/Logger.swift
      - path: Sources/AppFolder.swift
      - path: Sources/UI/CommandPalette.swift
      - path: Sources/UI/CommandPaletteView.swift
      - path: Sources/Workspace/PaneTree.swift
      - path: Sources/Workspace/Workspace.swift
      - path: Sources/Workspace/Session.swift
      - path: Sources/Workspace/TerminalModel.swift
      - path: Sources/History/HistoryStore.swift
      - path: Sources/Agent
      - path: Sources/Ghostty
      - path: Sources/Settings/ConfigSetting.swift
      - path: Sources/Settings/Preferences.swift
      - path: Sources/Settings/SettingsStore.swift
      - path: Sources/Settings/Themes.swift
      - path: Sources/ServiceProvider.swift
      - path: Sources/UI/ClipboardConfirmation.swift
      - path: Sources/UI/UntrustedLinkAlert.swift
      - path: Sources/UI/LinkPreviewView.swift
      - path: Sources/UI/SearchBarView.swift
      - path: Sources/UI/PaneTreeView.swift
      - path: Sources/UI/TerminalScrollbar.swift
      - path: Sources/UI/WindowContentViewController.swift
      - path: Sources/UI/WorkspaceMenu.swift
      - path: Sources/UI/RowDrop.swift
      - path: Sources/UI/TabBarView.swift
      - path: Sources/UI/AgentDotView.swift
      - path: Sources/UI/AgentGlyphView.swift
      - path: Sources/UI/UnreadBadgeView.swift
      - path: Sources/UI/WorkspaceAccent.swift
      - path: Sources/UI/RelativeAge.swift
      - path: Sources/UI/SidebarAgentRow.swift
      - path: Sources/UI/SidebarViewController.swift
      - path: Sources/UI/WorkspaceListViewController.swift
      - path: Sources/UI/AgentListViewController.swift
      - path: Sources/UI/HistoryListViewController.swift
      - path: Sources/UI/KeyboardShortcuts.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phucngo.codeTests
        GENERATE_INFOPLIST_FILE: YES
